name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the site logic
        run: node --test site/tests/
      - name: Collect the published files
        run: |
          mkdir -p _site
          cp -r site/index.html site/assets site/data _site/
      # browsers keep scripts and styles for hours: an address of their own per commit makes a deploy load the new ones
      - name: Version the asset URLs with the commit
        run: |
          v=${GITHUB_SHA::12}
          sed -i -E "s#\"assets/(app\.js|theme\.js|style\.css)\"#\"assets/\1?v=$v\"#" _site/index.html
          sed -i "s#from './core.js'#from './core.js?v=$v'#" _site/assets/app.js
          test "$(grep -c "?v=$v" _site/index.html)" = 3
          grep -q "from './core.js?v=$v'" _site/assets/app.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
